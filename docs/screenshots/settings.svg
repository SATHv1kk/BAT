<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="400" height="480" fill="#ffffff"/>

  <!-- header -->
  <rect x="0" y="0" width="400" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="400" y2="52" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="28" cy="26" r="14" fill="#111111"/>
  <text x="50" y="31" font-size="15" font-weight="600" fill="#1f1f1f">BAT</text>
  <rect x="344" y="14" width="28" height="24" rx="6" fill="#f0f0f0" stroke="#e5e5e5"/>
  <text x="358" y="31" font-size="14" text-anchor="middle" fill="#1f1f1f">&#9881;</text>

  <!-- settings panel -->
  <rect x="0" y="52" width="400" height="428" fill="#fafafa"/>

  <text x="16" y="80" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6b7280">DEEPSEEK API KEY</text>
  <rect x="16" y="88" width="300" height="30" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="26" y="107" font-size="12" fill="#9ca3af">sk-••••••••••••••••••••••</text>
  <rect x="324" y="88" width="60" height="30" rx="6" fill="none" stroke="#e5e5e5"/>
  <text x="354" y="107" font-size="12" text-anchor="middle" fill="#6b7280">Save</text>
  <text x="16" y="132" font-size="11" fill="#16a34a">Key saved — 1 model available</text>

  <text x="16" y="162" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6b7280">MODEL</text>
  <rect x="16" y="170" width="180" height="28" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="28" y="189" font-size="12" fill="#1f1f1f">V4 Pro</text>
  <text x="176" y="189" font-size="10" fill="#6b7280">▾</text>

  <text x="16" y="222" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6b7280">SITE ACCESS FOR PAGE ACTIONS</text>
  <text x="16" y="240" font-size="11" fill="#6b7280">2 sites allowed</text>
  <text x="16" y="256" font-size="11" fill="#6b7280">The active tab is automatically trusted. For</text>
  <text x="16" y="270" font-size="11" fill="#6b7280">all-tab access, enable below.</text>
  <rect x="16" y="280" width="14" height="14" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text x="38" y="291" font-size="11" fill="#6b7280">Allow <tspan font-weight="700" fill="#1f1f1f">all</tspan> sites (unrestricted)</text>

  <text x="16" y="322" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6b7280">WORKSPACE — WHERE FILES GO</text>
  <text x="16" y="340" font-size="11" fill="#6b7280">Fixed location: embedded storage</text>
  <rect x="16" y="350" width="110" height="26" rx="6" fill="none" stroke="#e5e5e5"/>
  <text x="71" y="367" font-size="11" text-anchor="middle" fill="#6b7280">Choose folder</text>

  <text x="16" y="404" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6b7280">STORED DATA</text>
  <rect x="16" y="412" width="150" height="26" rx="6" fill="none" stroke="#e5e5e5"/>
  <text x="91" y="429" font-size="11" text-anchor="middle" fill="#6b7280">Manage stored data</text>
  <text x="176" y="429" font-size="11" fill="#6b7280">3 collections</text>

  <text x="16" y="460" font-size="11" font-weight="600" letter-spacing="0.4" fill="#6b7280">CONVERSATION</text>
</svg>
