<svg xmlns="http://www.w3.org/2000/svg" width="400" height="540" viewBox="0 0 400 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="400" height="540" fill="#ffffff"/>

  <!-- header -->
  <rect x="0" y="0" width="400" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="400" y2="52" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="28" cy="26" r="14" fill="#111111"/>
  <text x="50" y="31" font-size="15" font-weight="600" fill="#1f1f1f">BAT</text>
  <rect x="266" y="15" width="68" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="300" y="30" font-size="11" font-weight="500" text-anchor="middle" fill="#1f1f1f">96 rows</text>
  <rect x="344" y="14" width="28" height="24" rx="6" fill="none" stroke="#e5e5e5"/>
  <text x="358" y="31" font-size="14" text-anchor="middle" fill="#6b7280">&#9881;</text>

  <!-- user message -->
  <rect x="154" y="72" width="230" height="54" rx="16" fill="#d97757"/>
  <text x="172" y="94" font-size="13" fill="#ffffff">Collect robotics job postings</text>
  <text x="172" y="112" font-size="13" fill="#ffffff">from Acme Robotics, dedupe by title.</text>

  <!-- assistant message -->
  <rect x="16" y="142" width="270" height="34" rx="16" fill="#f1f1f1"/>
  <text x="30" y="163" font-size="13" fill="#1f1f1f">On it — reading the careers page now.</text>

  <!-- activity: observe -->
  <rect x="16" y="192" width="368" height="64" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <circle cx="34" cy="212" r="11" fill="#111111"/>
  <text x="34" y="216" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
  <text x="54" y="208" font-size="10" font-weight="700" letter-spacing="0.5" fill="#6b7280">OBSERVE</text>
  <text x="54" y="224" font-size="13" font-weight="600" fill="#1f1f1f">Read page</text>
  <text x="30" y="244" font-size="11" font-family="Consolas, ui-monospace, monospace" fill="#4b5563">acme-robotics.example/careers/jobs</text>

  <!-- activity: executing -->
  <rect x="16" y="268" width="368" height="64" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <circle cx="34" cy="288" r="11" fill="#111111"/>
  <text x="34" y="292" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
  <text x="54" y="284" font-size="10" font-weight="700" letter-spacing="0.5" fill="#6b7280">EXECUTING</text>
  <text x="54" y="300" font-size="13" font-weight="600" fill="#1f1f1f">extract_rows</text>
  <text x="30" y="320" font-size="11" font-family="Consolas, ui-monospace, monospace" fill="#4b5563">cached extractor replayed · 0 model calls</text>

  <!-- activity: result (success) -->
  <rect x="16" y="344" width="368" height="64" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="34" cy="364" r="11" fill="#111111"/>
  <text x="34" y="368" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
  <text x="54" y="360" font-size="10" font-weight="700" letter-spacing="0.5" fill="#6b7280">RESULT</text>
  <text x="54" y="376" font-size="13" font-weight="600" fill="#1f1f1f">Rows collected</text>
  <text x="30" y="396" font-size="11" font-family="Consolas, ui-monospace, monospace" fill="#4b5563">jobs.tsv: +18 new, 4 duplicate(s) merged → 96 unique</text>

  <!-- live status -->
  <line x1="0" y1="408" x2="400" y2="408" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="32" cy="428" r="4" fill="#d97757"/>
  <text x="44" y="432" font-size="12" fill="#6b7280">Reading page 3 of 5…</text>

  <!-- input area -->
  <rect x="12" y="460" width="354" height="44" rx="22" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="28" y="487" font-size="14" fill="#9ca3af">Message...</text>
  <circle cx="366" cy="482" r="16" fill="#d97757"/>
  <text x="366" y="487" font-size="14" text-anchor="middle" fill="#ffffff">&#8593;</text>
</svg>
