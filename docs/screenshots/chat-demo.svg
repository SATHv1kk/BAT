<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="400" height="500" fill="#ffffff"/>

  <!-- header -->
  <rect x="0" y="0" width="400" height="52" fill="#ffffff"/>
  <line x1="0" y1="52" x2="400" y2="52" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="28" cy="26" r="14" fill="#111111"/>
  <text x="50" y="31" font-size="15" font-weight="600" fill="#1f1f1f">BAT</text>
  <rect x="266" y="15" width="68" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="300" y="30" font-size="11" font-weight="500" text-anchor="middle" fill="#1f1f1f">96 rows</text>
  <rect x="344" y="14" width="28" height="24" rx="6" fill="none" stroke="#e5e5e5"/>
  <text x="358" y="31" font-size="14" text-anchor="middle" fill="#6b7280">&#9881;</text>

  <!-- user message -->
  <rect x="154" y="72" width="230" height="54" rx="16" fill="#d97757"/>
  <text x="172" y="94" font-size="13" fill="#ffffff">Collect robotics job postings</text>
  <text x="172" y="112" font-size="13" fill="#ffffff">from Acme Robotics, dedupe by title.</text>

  <!-- assistant message -->
  <rect x="16" y="142" width="270" height="34" rx="16" fill="#f1f1f1"/>
  <text x="30" y="163" font-size="13" fill="#1f1f1f">On it — reading the careers page now.</text>

  <!-- activity: observe (single-row top: step + phase + title, per .activity-top flex layout) -->
  <rect x="16" y="192" width="368" height="56" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <circle cx="34" cy="214" r="11" fill="#111111"/>
  <text x="34" y="218" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
  <text x="54" y="218" font-size="10" font-weight="700" letter-spacing="0.5" fill="#6b7280">OBSERVING PAGE</text>
  <text x="160" y="219" font-size="13" font-weight="600" fill="#1f1f1f">Read page</text>
  <text x="30" y="238" font-size="11" font-family="Consolas, ui-monospace, monospace" fill="#4b5563">acme-robotics.example/careers/jobs</text>

  <!-- activity: executing -->
  <rect x="16" y="260" width="368" height="56" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <circle cx="34" cy="282" r="11" fill="#111111"/>
  <text x="34" y="286" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
  <text x="54" y="286" font-size="10" font-weight="700" letter-spacing="0.5" fill="#6b7280">EXECUTING</text>
  <text x="125" y="287" font-size="13" font-weight="600" fill="#1f1f1f">extract_rows</text>
  <text x="30" y="306" font-size="11" font-family="Consolas, ui-monospace, monospace" fill="#4b5563">cached extractor replayed · 0 model calls</text>

  <!-- activity: result (success) -->
  <rect x="16" y="328" width="368" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="34" cy="350" r="11" fill="#111111"/>
  <text x="34" y="354" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
  <text x="54" y="354" font-size="10" font-weight="700" letter-spacing="0.5" fill="#6b7280">RESULT</text>
  <text x="105" y="355" font-size="13" font-weight="600" fill="#1f1f1f">Rows extracted</text>
  <text x="30" y="374" font-size="11" font-family="Consolas, ui-monospace, monospace" fill="#4b5563">jobs.tsv: +18 new, 4 duplicate(s) merged → 96 unique</text>

  <!-- live status -->
  <line x1="0" y1="396" x2="400" y2="396" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="32" cy="416" r="4" fill="#d97757"/>
  <text x="44" y="420" font-size="12" fill="#6b7280">Reading page 3 of 5…</text>

  <!-- input area -->
  <rect x="12" y="444" width="354" height="44" rx="22" fill="#f8f8f8" stroke="#e5e5e5"/>
  <text x="28" y="471" font-size="14" fill="#9ca3af">Message...</text>
  <circle cx="366" cy="466" r="16" fill="#d97757"/>
  <text x="366" y="471" font-size="14" text-anchor="middle" fill="#ffffff">&#8593;</text>
</svg>
